name: Release

# Builds an attested, checksummed EQ2Parser release from CI — replacing the
# laptop `release.ps1 -Publish` flow (which trusted a personal gh token).
#
#   * push a tag `vX.Y.Z`      -> builds, attests, and PUBLISHES a release
#   * run manually (dispatch)  -> builds + attests, uploads the installer +
#                                 checksums as run artifacts; only publishes if
#                                 you tick `publish`
#
# INTERIM (no code signing): integrity comes from build-provenance attestation
# (proves the binary was built from this repo in CI) + a published SHA256SUMS.txt.
# Users get a one-time SmartScreen warning. To add a real Authenticode signature
# later (Certum, ~$58/yr, repo must go public) see docs/code-signing.md — the
# signing step slots in between "Pack" and "Attest". The prior SignPath wiring is
# in this file's git history (the "interim switch" commit).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (manual runs only).'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub Release (leave off for a build-only test run).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for build-provenance attestation
  attestations: write # write the attestation

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $v = '${{ inputs.version }}'
          }
          if (-not $v) { throw 'No version resolved.' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack (vpk)
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: >
          dotnet publish src/EQ2Parser.App -c Release -r win-x64 --self-contained true
          -o publish /p:Version=${{ steps.ver.outputs.version }}

      - name: Pack (Velopack)
        shell: pwsh
        run: >
          vpk pack --packId EQ2Parser --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish --mainExe EQ2Parser.App.exe --packTitle EQ2Parser
          --outputDir Releases --icon src/EQ2Parser.App/Assets/EQ2Parser.ico

      # Publish checksums so a download can be verified without a code signature.
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem Releases -Include *.exe, *.nupkg -Recurse
          if (-not $files) { throw 'No release artifacts to checksum.' }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content -Path Releases/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256SUMS.txt:"; Get-Content Releases/SHA256SUMS.txt

      # Build-provenance attestation (the repo is public, so this succeeds):
      # cryptographic proof the binary was built from this repo in CI.
      # continue-on-error stays as a belt-and-braces net. SHA256SUMS.txt
      # complements it.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            Releases/EQ2Parser-win-Setup.exe
            Releases/*.nupkg

      # Test run (manual, publish off): keep the installer + checksums as run
      # artifacts for verification without shipping anything.
      - name: Upload build artifacts (test run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: eq2parser-setup
          path: |
            Releases/EQ2Parser-win-Setup.exe
            Releases/SHA256SUMS.txt

      # Real release (tag push, or manual with publish ticked). Publishes to
      # the public EQ2Parser-releases repo (distribution is kept separate
      # from the code repo; the in-app updater reads that feed anonymously).
      # Cross-repo publishing is beyond GITHUB_TOKEN's scope, hence the
      # RELEASES_PAT secret (fine-grained PAT: Contents read+write on
      # EQ2Parser-releases only).
      # STABLE channel: releases are full (not pre-release). The in-app
      # updater reads stable releases (GithubSource prerelease: false).
      # Transition note: existing installs still on the prerelease:true
      # updater also see a newer FULL release (include-prereleases is a
      # superset), so the first stable release upgrades them onto the
      # stable channel with no stranding.
      - name: Preflight — releases-repo credential is present
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          REL_PAT: ${{ secrets.RELEASES_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REL_PAT)) {
            throw 'RELEASES_PAT is missing. Add a fine-grained PAT (Contents read+write on VortexUK/EQ2Parser-releases) as a Repository secret named RELEASES_PAT.'
          }
          Write-Host 'RELEASES_PAT present.'

      # Primary/canonical feed: this repo (public). Same-repo publish uses
      # the workflow's own GITHUB_TOKEN (contents:write granted above) — no
      # PAT needed. Main starts as an empty feed, so this is a clean full
      # release; run FIRST so the fresh post-pack dir isn't perturbed.
      - name: Publish GitHub Release (main repo)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        run: >
          vpk upload github --repoUrl https://github.com/VortexUK/EQ2Parser
          --publish --releaseName "EQ2Parser ${{ steps.ver.outputs.version }}"
          --tag "v${{ steps.ver.outputs.version }}"
          --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases

      - name: Attach checksums to release (main repo)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "v${{ steps.ver.outputs.version }}" Releases/SHA256SUMS.txt
          --clobber -R VortexUK/EQ2Parser

      # TRANSITIONAL — also publish to the old releases-only repo so installs
      # still on the pre-move updater (RepoUrl = EQ2Parser-releases, i.e.
      # anything <= v0.3.2) find this release and migrate onto the main feed.
      # REMOVE this step (and the RELEASES_PAT preflight) once testers are on
      # v0.3.3+; from then on they poll the main repo. vpk re-syncs the old
      # repo's own release history, so running it second is safe.
      - name: Publish GitHub Release (transitional — old releases repo)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        run: >
          vpk upload github --repoUrl https://github.com/VortexUK/EQ2Parser-releases
          --publish --releaseName "EQ2Parser ${{ steps.ver.outputs.version }}"
          --tag "v${{ steps.ver.outputs.version }}"
          --token ${{ secrets.RELEASES_PAT }} --outputDir Releases
