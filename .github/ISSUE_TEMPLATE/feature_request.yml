name: Feature request
description: Propose a new feature or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [open issues](https://github.com/VortexUK/EQ2Parser/issues?q=is%3Aissue) first — it might already be tracked.

        For non-trivial changes, expect a conversation about scope before code lands. See [CONTRIBUTING.md](https://github.com/VortexUK/EQ2Parser/blob/main/CONTRIBUTING.md). Note the deliberate non-goals: multi-game support, binary ACT-plugin compatibility, and anything that changes the stable stat numbers.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation that prompted this. "During raids I can't see Y" beats "add a Y window".
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What change would solve it? Be as specific as you can.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - Parsing engine / encounter model
        - Triggers / spell timers
        - Overlays
        - Reports / exports / charts
        - EQ2Lexicon integration (uploads, trigger packs)
        - TTS / sounds
        - Settings / UI
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (including how other tools do it) and why this one is better.
    validations:
      required: false
